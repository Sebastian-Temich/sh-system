# Profil Codex „reviewer” dla shctl review run (codex exec -p reviewer).
# Format: od Codex 0.134 profil to osobny plik $CODEX_HOME/<nazwa>.config.toml z kluczami najwyższego
# poziomu, nakładany przez -p/--profile na ~/.codex/config.toml. Tabele [profiles.<nazwa>] w
# config.toml nie są już czytane.
# Źródło: sh-system/codex/reviewer.config.toml; install.sh linkuje go do ~/.codex/reviewer.config.toml.
#
# Prompt: shctl składa go przy każdym review ze skilla sh-review (jedno źródło dla Claude i Codexa),
# wynik według sh-system/templates/review.schema.json. shctl podaje prompt na stdin, a schemat przez
# --output-schema. Profil nie ustawia model_instructions_file, bo to zastąpiłoby instrukcje bazowe Codexa.
#
# Model i rozumowanie jak domyślne review.ryzyko w /Users/Shared/sh/konfiguracja.md (SH-lite F6,
# decyzja właściciela z 2026-11-10: najmocniejszy model Codexa dla PR z ryzykiem). shctl zawsze
# podaje -m i model_reasoning_effort z konfiguracji review, więc te wartości są tylko zapasowe.
model = "gpt-6-astra"
model_reasoning_effort = "high"
# Tylko odczyt: reviewer niczego nie zapisuje, a testy uruchamia CI.
sandbox_mode = "read-only"
approval_policy = "never"
