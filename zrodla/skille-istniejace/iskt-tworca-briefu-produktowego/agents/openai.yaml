display_name: ISKT - Tworca Briefu Produktowego
short_description: Porzadkuje pomysl na aplikacje lub funkcje i tworzy dokumenty projektu w Obsidianie.
default_prompt: Przygotuj brief produktowy i strukture dokumentacji w Obsidianie przed zleceniem pracy do ISKT Software House. Jesli brakuje informacji blokujacych, zadaj maksymalnie 3 pytania.
