name: Testy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalacja bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bats
      - name: Testy bats
        run: bats --recursive scripts
